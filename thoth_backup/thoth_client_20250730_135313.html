<!DOCTYPE html>
<html>
<head>
    <title>THOTH Multi-AI Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(45deg, #2C3E50, #3498DB);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .ai-controls {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            text-align: center;
        }
        .ai-controls button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .claude-btn {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            color: white;
        }
        .grok-btn {
            background: linear-gradient(45deg, #4ECDC4, #44A08D);
            color: white;
        }
        .gpt-btn {
            background: linear-gradient(45deg, #A8EDEA, #FED6E3);
            color: #333;
        }
        .ai-controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        #chat {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: white;
        }
        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .ai-message {
            background: #f1f3f4;
            color: #333;
            border-left: 4px solid #4285f4;
        }
        .system-message {
            background: #e8f5e8;
            color: #2e7d32;
            text-align: center;
            font-style: italic;
        }
        .input-container {
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }
        #messageInput:focus {
            border-color: #667eea;
        }
        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        #sendButton:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 THOTH - Multi-AI Chat System</h1>
            <p>Tactical Hub for Orchestrated Thinking Helix</p>
        </div>
        <div class="ai-controls">
            <button class="claude-btn" onclick="addAI('claude')">Add Claude</button>
            <button class="grok-btn" onclick="addAI('grok')">Add Grok</button>
            <button class="gpt-btn" onclick="addAI('gpt')">Add GPT</button>
        </div>
        <div id="chat"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your message..." />
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        const ws = new WebSocket('ws://127.0.0.1:3001');
        ws.onopen = function() {
            console.log('Connected to THOTH');
            displayMessage('🔗 Connected to THOTH System', 'system');
        };
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            displayMessage(`${data.sender}: ${data.content}`,
                data.sender.startsWith('User-') ? 'user' :
                data.sender === 'THOTH' ? 'system' : 'ai');
        };
        ws.onerror = function(error) {
            console.log('WebSocket error:', error);
            displayMessage('❌ Connection error', 'system');
        };
        function displayMessage(content, type) {
            const chat = document.getElementById('chat');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = content;
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight;
        }
        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (!input.value.trim()) return;
            const message = { type: 'message', content: input.value };
            ws.send(JSON.stringify(message));
            input.value = '';
        }
        function addAI(type) {
            const message = { type: 'addAI', aiType: type };
            ws.send(JSON.stringify(message));
        }
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
